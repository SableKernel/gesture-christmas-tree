<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas · 圣诞树</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #scene { position: fixed; inset: 0; display: block; cursor: pointer; }

  /* 视频同款：白色衬线大字距标题，居中顶部 */
  #titleWrap {
    position: fixed; top: 26px; left: 0; right: 0; z-index: 5;
    text-align: center; user-select: none; pointer-events: none;
  }
  #titleWrap h1 {
    font-family: 'Marcellus', 'Times New Roman', serif;
    font-size: clamp(24px, 3.6vw, 46px); font-weight: 400;
    color: #eafaff; letter-spacing: .42em; text-indent: .42em; line-height: 1.1;
    text-shadow: 0 0 14px rgba(140, 235, 255, 0.28), 0 0 40px rgba(140, 235, 255, 0.15);
  }
  #titleWrap .to {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(11px, 1.2vw, 14px);
    color: #8fd8e8; letter-spacing: .3em; text-indent: .3em; margin-top: 9px; opacity: .9;
    text-shadow: 0 0 10px rgba(130, 210, 255, 0.35);
  }

  /* 照片墙（深色玻璃 + 金色描边，小窗） */
  #photoPanel {
    position: fixed; top: 22px; right: 18px; z-index: 8; width: 196px;
    background: rgba(6, 10, 24, 0.66); border: 1px solid rgba(130, 210, 255, 0.3);
    border-radius: 12px; padding: 9px 10px 10px; backdrop-filter: blur(8px);
    box-shadow: 0 4px 22px rgba(0,0,0,.5); transition: box-shadow .25s;
  }
  #photoPanel.dragover { box-shadow: 0 0 0 2px rgba(120, 230, 255, .85), 0 0 26px rgba(120,230,255,.4); }
  #photoPanel h3 {
    font-family: 'Cormorant Garamond', serif; font-size: 12px; font-weight: 500; color: #d8f2ff;
    letter-spacing: 1.5px; margin-bottom: 7px; display: flex; align-items: center; gap: 6px;
  }
  #photoPanel h3 .dot { width: 5px; height: 5px; border-radius: 50%; background: #7ff0ff;
    box-shadow: 0 0 8px #7ff0ff; flex: none; }
  #thumbs { display: flex; flex-wrap: wrap; gap: 5px; }
  #thumbs .thumb {
    position: relative; width: 40px; height: 52px; border-radius: 5px; overflow: hidden;
    border: 1px solid rgba(120, 230, 255, 0.4); cursor: pointer; flex: none;
  }
  #thumbs .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #thumbs .thumb .rm {
    position: absolute; top: 0; right: 0; width: 13px; height: 13px; line-height: 12px;
    text-align: center; font-size: 9px; color: #fff; background: rgba(160, 30, 30, .8);
    border-radius: 0 4px 0 6px; cursor: pointer; display: none;
  }
  #thumbs .thumb:hover .rm { display: block; }
  #thumbs .thumb.sel { border-color: #7ff0ff; box-shadow: 0 0 10px rgba(150, 240, 255, .8); }
  #dropTip {
    margin-top: 7px; border: 1px dashed rgba(130, 210, 255, 0.4); border-radius: 7px;
    color: #7fb8cc; font-size: 10px; text-align: center; padding: 7px 3px; letter-spacing: 1px;
    opacity: .85; pointer-events: none;
  }

  /* 小按钮（深色 + 金色微光） */
  #toolbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 7; display: flex; gap: 7px; }
  #toolbar button {
    font-size: 11.5px; letter-spacing: 1px; color: #d8f2ff; cursor: pointer;
    background: rgba(8, 14, 30, 0.62); border: 1px solid rgba(130, 210, 255, 0.32);
    border-radius: 999px; padding: 5px 12px; backdrop-filter: blur(6px);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  #toolbar button:hover { transform: translateY(-2px); border-color: rgba(120,230,255,.8); box-shadow: 0 0 14px rgba(120, 230, 255, 0.35); }
  #toolbar button.on { background: rgba(120, 90, 30, 0.45); border-color: rgba(150, 240, 255, .85); }

  #hint {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 6;
    color: #7fb8cc; font-size: 10.5px; letter-spacing: 1px; opacity: .6; user-select: none;
    text-align: center; pointer-events: none; white-space: nowrap;
  }

  #cam {
    position: fixed; right: 18px; bottom: 18px; z-index: 6;
    width: 138px; height: auto; border-radius: 10px;
    border: 1px solid rgba(130, 210, 255, 0.5);
    box-shadow: 0 0 16px rgba(120, 230, 255, 0.25);
    transform: scaleX(-1); display: none; background: #000; opacity: .9;
  }
  #gestureStatus {
    position: fixed; right: 18px; bottom: 130px; z-index: 6; width: 138px;
    text-align: center; color: #d8f2ff; font-size: 10.5px; letter-spacing: .5px;
    display: none; background: rgba(6,10,24,.62); border-radius: 9px; padding: 5px 3px; line-height: 1.6;
  }
  #err {
    position: fixed; top: 46%; left: 50%; transform: translate(-50%,-50%); z-index: 9;
    color: #d8f2ff; font-size: 13px; line-height: 1.9; text-align: center; display: none;
    background: rgba(6,10,24,.9); padding: 14px 26px; border-radius: 12px;
    border: 1px solid rgba(130,210,255,.4); max-width: 460px;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="titleWrap">
  <h1>MERRY CHRISTMAS</h1>
  <div class="to">TO 所有看到这棵树的人 · 天天开心</div>
</div>

<div id="photoPanel">
  <h3><span class="dot"></span>照片墙 · 拖入照片即上树</h3>
  <div id="thumbs"></div>
  <div id="dropTip">把照片拖到页面任意位置即可挂上圣诞树</div>
</div>

<div id="hint">👍 竖大拇指放大最近的照片 · ✋ 绽放星云（照片漂浮）· ✊ 握拳收回 · 🤏 捏合关闭 · 挥手转树</div>
<div id="toolbar">
  <button id="btnPhoto">＋ 照片</button>
  <button id="btnDemo">🖼 示例</button>
  <button id="btnBurst">✨ 绽放</button>
  <button id="btnTree">🎄 回归</button>
  <button id="camBtn">🎥 手势</button>
</div>

<video id="cam" playsinline muted></video>
<div id="gestureStatus">手势识别中…</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

// 视频同款配色：金色为主 + 红绿蓝彩灯点缀，纯黑背景
const GOLD_COLS = ['#ffffff', '#aef6ff', '#7ff0ff', '#5adcff', '#b9f0ff'];
const ORN_COLS  = ['#5adcff', '#2ee6c8', '#9b8cff', '#ffffff'];

// ---------- 发光精灵 ----------
function makeDot(color, core) {
  const s = document.createElement('canvas'); s.width = s.height = 32;
  const c = s.getContext('2d');
  const g = c.createRadialGradient(16, 16, 0, 16, 16, 15);
  g.addColorStop(0, core || '#fff'); g.addColorStop(0.3, color);
  g.addColorStop(0.62, color + '55'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(16, 16, 15, 0, Math.PI * 2); c.fill();
  return s;
}
const dotSprites = {};
for (const c of [...GOLD_COLS, ...ORN_COLS]) dotSprites[c] = makeDot(c);
const markerDot = makeDot('#7ff0ff', '#fff');

// ---------- 圣诞专属装饰：平安果 / 圣诞袜 / 礼物盒 / 拐杖糖 / 铃铛 / 蝴蝶结 / 金星 ----------
function makeOrnament(kind) {
  const s = document.createElement('canvas'); s.width = s.height = 84;
  const c = s.getContext('2d'); c.translate(42, 42); c.lineJoin = c.lineCap = 'round';
  const rr = (x, y, w, h, r) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
  const star = (x, y, r, rot, fill) => {
    c.fillStyle = fill; c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + i * Math.PI * 0.4 - Math.PI / 2, a2 = a + Math.PI * 0.2;
      c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      c.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
    }
    c.closePath(); c.fill();
  };
  switch (kind) {
    case 'apple': // 平安果
      c.fillStyle = '#2ee6c8';
      c.beginPath(); c.arc(0, 5, 21, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#1f9fc8';
      c.beginPath(); c.arc(4, 10, 15, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(255,255,255,.4)';
      c.beginPath(); c.ellipse(-8, -3, 6, 9, -0.5, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#5a7aa8'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(0, -14); c.quadraticCurveTo(3, -22, 7, -26); c.stroke();
      c.fillStyle = '#5adcff';
      c.beginPath(); c.ellipse(10, -19, 9, 4.5, -0.35, 0, Math.PI * 2); c.fill();
      break;
    case 'sock': // 圣诞袜
      c.fillStyle = '#2f9fd8';
      c.beginPath();
      c.moveTo(-13, -24); c.lineTo(13, -24); c.lineTo(13, 0);
      c.quadraticCurveTo(27, 2, 27, 12); c.quadraticCurveTo(27, 22, 15, 22);
      c.lineTo(-13, 22); c.closePath(); c.fill();
      c.fillStyle = '#fff7ec';
      c.beginPath(); c.moveTo(-15, -28); c.lineTo(15, -28); c.lineTo(15, -18); c.lineTo(-15, -18); c.closePath(); c.fill();
      c.beginPath(); c.arc(15, 14, 7, 0, Math.PI * 2); c.fill();
      star(-2, 2, 8, 0.3, '#aef6ff');
      break;
    case 'gift': // 礼物盒
      c.fillStyle = '#7f6cd9'; rr(-20, -8, 40, 30, 4); c.fill();
      c.fillStyle = '#6354b8'; rr(-23, -16, 46, 10, 3); c.fill();
      c.fillStyle = '#7ff0ff';
      c.fillRect(-4, -16, 8, 38);
      c.beginPath(); c.ellipse(-11, -18, 10, 6, -0.5, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(11, -18, 10, 6, 0.5, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#7ff0ff';
      c.beginPath(); c.arc(0, -17, 4, 0, Math.PI * 2); c.fill();
      break;
    case 'cane': // 拐杖糖
      c.strokeStyle = '#fff7ec'; c.lineWidth = 10;
      c.beginPath(); c.moveTo(-3, 26); c.lineTo(-3, -4); c.arc(5, -4, 8, Math.PI, 0, false); c.stroke();
      c.strokeStyle = '#2ee6c8'; c.lineWidth = 10; c.setLineDash([5, 7]);
      c.beginPath(); c.moveTo(-3, 26); c.lineTo(-3, -4); c.arc(5, -4, 8, Math.PI, 0, false); c.stroke();
      c.setLineDash([]);
      break;
    case 'bell': // 铃铛
      c.fillStyle = '#7ff0ff';
      c.beginPath(); c.moveTo(-14, 14); c.quadraticCurveTo(-16, -14, 0, -16);
      c.quadraticCurveTo(16, -14, 14, 14); c.closePath(); c.fill();
      c.fillStyle = '#8fc4e0';
      c.beginPath(); c.ellipse(0, 14, 16, 4, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#eaffff';
      c.beginPath(); c.arc(0, -17, 4.5, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#2ee6c8';
      c.beginPath(); c.arc(9, -6, 3, 0, Math.PI * 2); c.fill();
      break;
    case 'bow': // 蝴蝶结
      c.fillStyle = '#2ee6c8';
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-26, -14, -20, 2); c.quadraticCurveTo(-16, 12, 0, 6); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(26, -14, 20, 2); c.quadraticCurveTo(16, 12, 0, 6); c.closePath(); c.fill();
      c.fillStyle = '#7ff0ff';
      c.beginPath(); c.ellipse(0, 2, 7, 5, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#2ee6c8'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(-4, 6); c.quadraticCurveTo(-8, 18, -12, 24); c.stroke();
      c.beginPath(); c.moveTo(4, 6); c.quadraticCurveTo(8, 18, 12, 24); c.stroke();
      break;
    case 'star': // 金星
      star(0, 0, 21, 0, '#7ff0ff');
      star(0, 0, 10, Math.PI / 5, '#eaffff');
      break;
  }
  return s;
}
const ORN_KINDS = ['apple', 'sock', 'gift', 'cane', 'bell', 'bow', 'star'];
const ornSprites = {}; ORN_KINDS.forEach(k => ornSprites[k] = makeOrnament(k));

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ---------- 场景 ----------
let dots = [], orns = [], bgStars = [], snows = [];
let tree = {};

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScene();
}

function buildScene() {
  // 布局：标题在顶部，树完全居中且树顶亮星完整可见
  const titleH = Math.min(H * 0.14, 110);
  const topperRoom = 84;                       // 树顶亮星 + 光晕预留
  const topY = titleH + topperRoom;            // 树尖
  const groundY = H - 64;
  const treeH = Math.max(groundY - topY, 220);
  const cx = W * 0.5;                          // 严格水平居中
  const Rmax = Math.min(W * 0.23, treeH * 0.4, 300);
  tree = { cx, topY, groundY, treeH, Rmax, cY: topY + treeH * 0.5, D: 0 };

  // 金色粒子树（锥形分布，彩灯点缀）
  dots = [];
  const N = Math.min(2800, Math.max(1400, Math.round(W * H / 560)));
  for (let i = 0; i < N; i++) {
    const v = Math.pow(Math.random(), 0.92);        // 0 顶 → 1 底
    const y = (0.5 - v) * treeH;                   // 局部纵向坐标：0=树中心，顶=+treeH/2，底=-treeH/2
    const rMax = Rmax * Math.pow(v, 0.95);           // v=1（底部）最宽，v=0（顶部）收尖
    const r = rMax * Math.pow(Math.random(), 0.38); // 偏向外壳，轮廓清晰
    const a = Math.random() * Math.PI * 2;
    const isOrn = Math.random() < 0.09;
    dots.push({
      x0: Math.cos(a) * r, y0: y, z0: Math.sin(a) * r,
      size: isOrn ? rand(2.6, 4.2) : rand(1.4, 2.9),
      color: isOrn ? pick(ORN_COLS) : pick(GOLD_COLS),
      phase: rand(0, Math.PI * 2), twSpeed: rand(1.4, 4.2),
      blink: Math.random() < 0.25                   // 部分灯泡式闪烁
    });
  }

  // 圣诞专属装饰：平安果 / 圣诞袜 / 礼物盒 / 拐杖糖 / 铃铛 / 蝴蝶结 / 金星
  orns = [];
  const ornCount = Math.min(26, Math.max(14, Math.round(W * H / 52000)));
  for (let i = 0; i < ornCount; i++) {
    const v = rand(0.16, 0.94);
    const r = Rmax * Math.pow(v, 0.95) * rand(0.55, 0.95) + 6;
    const a = Math.random() * Math.PI * 2;
    orns.push({
      x0: Math.cos(a) * r, y0: (0.5 - v) * treeH, z0: Math.sin(a) * r,
      kind: pick(ORN_KINDS), size: rand(26, 42), phase: rand(0, Math.PI * 2)
    });
  }

  bgStars = [];
  for (let i = 0; i < Math.round(W * H / 16000); i++) {
    bgStars.push({ x: rand(0, W), y: rand(0, H), size: rand(0.5, 1.6),
      color: pick(['#d8f4ff', '#9fd8f0', '#ffffff']), phase: rand(0, 6.28), twSpeed: rand(0.3, 1.4) });
  }
  snows = [];
  for (let i = 0; i < 55; i++) {
    snows.push({ x: rand(0, W), y: rand(-H, H), vy: rand(14, 34), swayA: rand(6, 24),
      swayS: rand(0.3, 1), phase: rand(0, 6.28), size: rand(1, 2.2) });
  }
  layoutPhotos();
}

// ---------- 照片（树上挂饰 → 绽放时漂浮星云） ----------
const photos = [];
const SLOTS = [[0.28, 15], [0.44, 75], [0.56, 140], [0.66, 35], [0.74, 110], [0.62, 215], [0.82, 300], [0.50, 335]];
let enlarged = -1, enlargeAnim = 0, hoverIdx = -1, handSelIdx = -1;
let photoScreen = [];

function addPhoto(img) {
  const slot = SLOTS[photos.length % SLOTS.length];
  photos.push({ img, v: slot[0], a: (slot[1] + rand(-8, 8)) * Math.PI / 180, appear: 0, tilt: rand(-0.3, 0.3) });
  renderThumbs();
}
function removePhoto(i) {
  photos.splice(i, 1);
  if (enlarged >= photos.length) enlarged = -1;
  layoutPhotos(); renderThumbs();
}
function layoutPhotos() {
  photos.forEach((p, i) => {
    const slot = SLOTS[i % SLOTS.length];
    p.v = slot[0]; p.a = (slot[1] + rand(-6, 6)) * Math.PI / 180;
    p.__orb = null;
  });
}
function renderThumbs() {
  const box = document.getElementById('thumbs');
  box.innerHTML = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (i === hoverIdx || i === handSelIdx ? ' sel' : '');
    const im = document.createElement('img'); im.src = p.img.src;
    const rm = document.createElement('span'); rm.className = 'rm'; rm.textContent = '×';
    rm.onclick = (e) => { e.stopPropagation(); removePhoto(i); };
    d.onclick = () => enlarge(i);
    d.appendChild(im); d.appendChild(rm); box.appendChild(d);
  });
}
function loadPhotoFile(f) {
  const img = new Image();
  img.onload = () => { addPhoto(img); flashStatus('🖼 照片已挂上圣诞树'); };
  img.src = URL.createObjectURL(f);
}

// ---------- 鼠标交互 ----------
canvas.addEventListener('mousemove', (e) => {
  if (!camHandActive) hoverIdx = hitTest(e.clientX, e.clientY);
});
canvas.addEventListener('click', (e) => {
  if (enlarged >= 0) { enlarged = -1; return; }
  const i = hitTest(e.clientX, e.clientY);
  if (i >= 0) enlarge(i);
});
function hitTest(mx, my) {
  let best = -1, bd = 46;
  photoScreen.forEach((p, i) => {
    if (!p.visible) return;
    const d = Math.hypot(p.sx - mx, p.sy - my);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function nearestPhoto(x, y, maxD) {
  let best = -1, bd = maxD;
  photoScreen.forEach((p, i) => {
    if (!p.visible) return;
    const d = Math.hypot(p.sx - x, p.sy - y);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function enlarge(i) { enlarged = i; enlargeAnim = 0; }

// ---------- 渲染循环 ----------
const FOCAL = 900;
let mode = 'tree';                 // tree | burst
let lastT = performance.now();
let spinBoost = 0;
let camHandActive = false, handMarker = null;

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  const t = now / 1000;
  spinBoost *= Math.pow(0.02, dt);
  tree.D += (0.32 + spinBoost) * dt;
  const bob = Math.sin(t * 0.7) * 4;
  const cosD = Math.cos(tree.D), sinD = Math.sin(tree.D);
  const k = 1 - Math.exp(-dt * 2.2);
  const cY = tree.cY + bob;

  // 背景：纯黑 + 微弱星点
  ctx.globalCompositeOperation = 'source-over';
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#070d26'); bgGrad.addColorStop(0.55, '#121038'); bgGrad.addColorStop(1, '#221358');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  for (const b of bgStars) {
    ctx.globalAlpha = 0.18 + 0.4 * (0.5 + 0.5 * Math.sin(t * b.twSpeed + b.phase));
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 树后金色氛围光
  const halo = ctx.createRadialGradient(tree.cx, cY, 10, tree.cx, cY, tree.Rmax * 2.1);
  halo.addColorStop(0, 'rgba(120, 230, 255, 0.10)'); halo.addColorStop(0.5, 'rgba(120, 230, 255, 0.045)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);

  // 地面光 + 光环
  const gy = tree.groundY + 6;
  const gGlow = ctx.createRadialGradient(tree.cx, gy, 5, tree.cx, gy, tree.Rmax * 1.5);
  gGlow.addColorStop(0, 'rgba(120, 230, 255, 0.16)'); gGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gGlow; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(tree.cx, gy); ctx.scale(1, 0.24);
  for (let i = 0; i < 2; i++) {
    ctx.strokeStyle = `rgba(120,230,255,${0.16 - i * 0.06})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, tree.Rmax * (1.1 + i * 0.65), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();

  drawTrunk(t);

  // ---- 3D 投影 + 深度排序 ----
  const drawList = [];
  const proj = (x, y, z) => {
    const xr = x * cosD - z * sinD, zr = x * sinD + z * cosD;
    const p = FOCAL / (FOCAL + zr);
    return { sx: tree.cx + xr * p, sy: cY - y * p, zr, persp: p };
  };
  const upd = (o) => {
    let tx, ty, tz;
    if (mode === 'burst') {
      if (!o.__orb) o.__orb = {
        a: Math.atan2(o.z0, o.x0) + rand(-0.4, 0.4),
        r: Math.hypot(o.x0, o.z0) * rand(1.5, 3.0) + 70,
        y: o.y0 + rand(-110, 110),
        s: rand(0.25, 1.0) * (Math.random() < 0.7 ? 1 : -1)
      };
      const ob = o.__orb; ob.a += ob.s * dt;
      tx = Math.cos(ob.a) * ob.r; tz = Math.sin(ob.a) * ob.r; ty = ob.y;
    } else { tx = o.x0; ty = o.y0; tz = o.z0; o.__orb = null; }
    if (o.x === undefined) { o.x = tx; o.y = ty; o.z = tz; }
    o.x += (tx - o.x) * k; o.y += (ty - o.y) * k; o.z += (tz - o.z) * k;
  };

  for (const d of dots) { upd(d); const q = proj(d.x, d.y, d.z); drawList.push({ zr: q.zr, kind: 'dot', o: d, q }); }
  for (const o of orns) { upd(o); const q = proj(o.x, o.y, o.z); drawList.push({ zr: q.zr, kind: 'orn', o, q }); }
  photoScreen = [];
  photos.forEach((p, i) => {
    const r = tree.Rmax * Math.pow(p.v, 0.9) + 6;
    p.x0 = Math.cos(p.a) * r; p.y0 = (0.5 - p.v) * tree.treeH; p.z0 = Math.sin(p.a) * r;
    upd(p);
    const q = proj(p.x, p.y, p.z);
    // 视频式：平时照片收进树里（树保持纯净），绽放/放大时才浮现
    const tgt = (mode === 'burst' || enlarged === i) ? 1 : 0;
    p.appear = (p.appear || 0) + (tgt - (p.appear || 0)) * Math.min(1, dt * 3);
    photoScreen.push({ sx: q.sx, sy: q.sy, persp: q.persp, img: p.img, visible: p.appear > 0.02 });
    if (p.appear > 0.02) drawList.push({ zr: q.zr, kind: 'photo', idx: i, q });
  });

  drawList.sort((a, b) => b.zr - a.zr);

  const selIdx = (camHandActive && handSelIdx >= 0) ? handSelIdx : hoverIdx;
  const burstFloat = mode === 'burst';

  // 粒子：加色混合发光（视频质感）
  ctx.globalCompositeOperation = 'lighter';
  for (const d of drawList) {
    if (d.kind === 'dot') {
      const o = d.o, q = d.q;
      let tw = 0.5 + 0.5 * (0.5 + 0.5 * Math.sin(t * o.twSpeed + o.phase));
      if (o.blink && Math.sin(t * o.twSpeed * 2 + o.phase) < -0.2) tw *= 0.15;   // 灯泡闪烁
      const depth = 0.5 + 0.5 * ((d.zr + tree.Rmax * 1.5) / (tree.Rmax * 3));
      const s = o.size * 3.2 * q.persp;
      ctx.globalAlpha = Math.min(1, (0.35 + 0.65 * tw) * (0.55 + 0.55 * depth));
      ctx.drawImage(dotSprites[o.color], q.sx - s / 2, q.sy - s / 2, s, s);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // 圣诞装饰（随树旋转、轻微摇摆、深度渐隐）
  for (const d of drawList) {
    if (d.kind !== 'orn') continue;
    const o = d.o, q = d.q;
    const depth = 0.5 + 0.5 * ((d.zr + tree.Rmax * 1.5) / (tree.Rmax * 3));
    const s = o.size * q.persp;
    ctx.save();
    ctx.translate(q.sx, q.sy);
    ctx.rotate(Math.sin(t * 1.4 + o.phase) * 0.09);
    ctx.globalAlpha = Math.min(1, 0.4 + 0.6 * depth);
    ctx.drawImage(ornSprites[o.kind], -s / 2, -s / 2, s, s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 照片卡片（树上挂饰 / 绽放时漂浮星云，轻微倾斜）
  for (const d of drawList) {
    if (d.kind !== 'photo') continue;
    const p = photos[d.idx], q = d.q, img = p.img;
    const w = 48 * q.persp * p.appear, h = w * (img.height / img.width);
    const hl = d.idx === selIdx;
    const tilt = burstFloat ? p.tilt + Math.sin(t * 0.6 + d.idx) * 0.18 : Math.sin(t * 0.5 + d.idx) * 0.05;
    const depth = 0.5 + 0.5 * ((d.zr + tree.Rmax * 1.5) / (tree.Rmax * 3));
    ctx.save();
    ctx.translate(q.sx, q.sy); ctx.rotate(tilt);
    ctx.globalAlpha = Math.min(1, (0.45 + 0.55 * depth) * p.appear);
    ctx.shadowColor = hl ? 'rgba(150, 240, 255, 0.95)' : 'rgba(120, 230, 255, 0.45)';
    ctx.shadowBlur = hl ? 15 : 6;
    ctx.fillStyle = 'rgba(230, 248, 255, 0.96)';
    rrect(ctx, -w / 2 - 2.5, -h / 2 - 2.5, w + 5, h + 5, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.save();
    ctx.beginPath(); rrect(ctx, -w / 2, -h / 2, w, h, 3.5); ctx.clip();
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
    if (hl) {
      ctx.strokeStyle = 'rgba(150, 240, 255, 0.9)'; ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 3]); ctx.lineDashOffset = -t * 22;
      ctx.beginPath(); rrect(ctx, -w / 2 - 6, -h / 2 - 6, w + 12, h + 12, 8); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  drawTopper(t, bob);

  // ---- 放大的照片：金色相框居中（视频同款效果） ----
  if (enlarged >= 0 && photos[enlarged]) {
    enlargeAnim = Math.min(1, enlargeAnim + dt * 2.6);
    const e = 1 - Math.pow(1 - enlargeAnim, 3);
    const img = photos[enlarged].img;
    const maxH = Math.min(H * 0.56, H - 170);
    const ih = maxH * e, iw = ih * (img.width / img.height);
    const cxp = W / 2, cyp = H * 0.46 + Math.sin(t * 1.1) * 5;
    const gl = ctx.createRadialGradient(cxp, cyp, ih * 0.2, cxp, cyp, ih * 0.8);
    gl.addColorStop(0, 'rgba(120,230,255,0.30)'); gl.addColorStop(1, 'rgba(120,230,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.shadowColor = 'rgba(150, 240, 255, 0.85)'; ctx.shadowBlur = 34;
    ctx.fillStyle = '#eaffff';
    rrect(ctx, cxp - iw / 2 - 5, cyp - ih / 2 - 5, iw + 10, ih + 10, 12); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); rrect(ctx, cxp - iw / 2, cyp - ih / 2, iw, ih, 8); ctx.clip();
    ctx.drawImage(img, cxp - iw / 2, cyp - ih / 2, iw, ih);
    ctx.restore();
    for (let i = 0; i < 9; i++) {           // 环绕金星
      const a = t * 0.6 + i * Math.PI / 4.5;
      drawStarShape(cxp + Math.cos(a) * iw * 0.68, cyp + Math.sin(a) * ih * 0.55,
        4.5 + Math.sin(t * 3 + i) * 2, a, '#7ff0ff', 0.85);
    }
  }

  // 雪花/飘落微光
  ctx.globalCompositeOperation = 'lighter';
  for (const f of snows) {
    f.y += f.vy * dt;
    if (f.y > H + 6) { f.y = -6; f.x = rand(0, W); }
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#d8f4ff';
    ctx.beginPath(); ctx.arc(f.x + Math.sin(t * f.swayS + f.phase) * f.swayA, f.y, f.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // 手部追踪标记（小金星跟随手掌）
  if (camHandActive && handMarker && now - handMarker.seenAt < 600) {
    ctx.globalCompositeOperation = 'lighter';
    const s = 13 + Math.sin(t * 5) * 2;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(markerDot, handMarker.x - s, handMarker.y - s, s * 2, s * 2);
    ctx.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(frame);
}

// 树顶亮星（视频同款：菱形星光 + 光芒）
function drawTopper(t, bob) {
  const x = tree.cx, y = tree.topY - 26 + bob;
  const pulse = 1 + 0.18 * Math.sin(t * 2.6);
  const r = 15 * pulse;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(x, y, 1, x, y, 46);
  gl.addColorStop(0, 'rgba(180, 240, 255, 0.55)'); gl.addColorStop(0.35, 'rgba(150, 240, 255, 0.25)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI * 2); ctx.fill();
  // 四芒星光（菱形双层）
  ctx.fillStyle = '#eaffff';
  ctx.shadowColor = '#7ff0ff'; ctx.shadowBlur = 18;
  for (const rot of [0, Math.PI / 2]) {
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(rot) * r, y + Math.sin(rot) * r);
    ctx.lineTo(x + Math.cos(rot + Math.PI / 2) * r * 0.22, y + Math.sin(rot + Math.PI / 2) * r * 0.22);
    ctx.lineTo(x - Math.cos(rot) * r, y - Math.sin(rot) * r);
    ctx.lineTo(x - Math.cos(rot + Math.PI / 2) * r * 0.22, y - Math.sin(rot + Math.PI / 2) * r * 0.22);
    ctx.closePath(); ctx.fill();
  }
  // 长光芒线
  ctx.strokeStyle = 'rgba(200, 246, 255, 0.8)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const a = t * 0.4 + i * Math.PI / 2;
    const len = r * (2.1 + 0.55 * Math.sin(t * 3 + i));
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
  }
  ctx.restore();
}

function drawTrunk(t) {
  const { cx, groundY, Rmax, treeH } = tree;
  const w = Math.max(22, Rmax * 0.26), h = Math.max(treeH * 0.09, 30);
  const top = groundY - 3, bot = groundY + h;
  const tg = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  tg.addColorStop(0, '#101c38'); tg.addColorStop(0.35, '#2c4a7a'); tg.addColorStop(0.6, '#1d3a66'); tg.addColorStop(1, '#0e1830');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.4, top); ctx.quadraticCurveTo(cx - w / 2, (top + bot) / 2, cx - w * 0.44, bot - 5);
  ctx.quadraticCurveTo(cx - w * 0.25, bot, cx, bot); ctx.quadraticCurveTo(cx + w * 0.25, bot, cx + w * 0.44, bot - 5);
  ctx.quadraticCurveTo(cx + w / 2, (top + bot) / 2, cx + w * 0.4, top);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - w / 2, top, w, h); ctx.clip();
  ctx.strokeStyle = 'rgba(150, 240, 255, 0.5)'; ctx.lineWidth = Math.max(2, w * 0.075);
  for (let y = top - w; y < bot + w; y += w * 0.5) {
    ctx.beginPath(); ctx.moveTo(cx - w, y); ctx.lineTo(cx + w, y + w * 0.7); ctx.stroke();
  }
  ctx.restore();
}
function rrect(c, x, y, w, h, r) {
  if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r);
}
function drawStarShape(x, y, r, rot, color, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = rot + i * Math.PI * 0.4 - Math.PI / 2, a2 = a + Math.PI * 0.2;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);

// ---------- UI ----------
const errEl = document.getElementById('err');
const statusEl = document.getElementById('gestureStatus');
function showError(msg) { errEl.innerHTML = msg; errEl.style.display = 'block'; setTimeout(() => errEl.style.display = 'none', 8000); }
function flashStatus(text) { statusEl.textContent = text; statusEl.style.display = 'block'; setTimeout(() => { statusEl.style.display = camActive ? 'block' : 'none'; }, 2500); }

document.getElementById('btnPhoto').addEventListener('click', () => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = () => [...inp.files].forEach(loadPhotoFile);
  inp.click();
});
document.getElementById('btnDemo').addEventListener('click', addDemoPhotos);
document.getElementById('btnBurst').addEventListener('click', () => { mode = 'burst'; flashStatus('✨ 粒子绽放成星云'); });
document.getElementById('btnTree').addEventListener('click', () => { mode = 'tree'; flashStatus('🎄 粒子回归圣诞树'); });
window.addEventListener('dragover', e => { e.preventDefault(); document.getElementById('photoPanel').classList.add('dragover'); });
window.addEventListener('dragleave', () => document.getElementById('photoPanel').classList.remove('dragover'));
window.addEventListener('drop', e => {
  e.preventDefault(); document.getElementById('photoPanel').classList.remove('dragover');
  [...(e.dataTransfer.files || [])].filter(f => f.type.startsWith('image/')).forEach(loadPhotoFile);
});

// 示例照片（金色调卡片，先试效果用）
function addDemoPhotos() {
  const themes = [['#5adcff', '#0c2438'], ['#9b8cff', '#241a4a'], ['#2ee6c8', '#0a3028']];
  themes.forEach((c, i) => {
    const cv = document.createElement('canvas'); cv.width = 150; cv.height = 200;
    const c2 = cv.getContext('2d');
    const g = c2.createLinearGradient(0, 0, 0, 200);
    g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
    c2.fillStyle = g; c2.fillRect(0, 0, 150, 200);
    c2.fillStyle = 'rgba(255,255,255,.95)';
    c2.beginPath();
    for (let j = 0; j < 5; j++) {
      const a = j * Math.PI * 0.4 - Math.PI / 2, a2 = a + Math.PI * 0.2;
      c2.lineTo(75 + Math.cos(a) * 26, 80 + Math.sin(a) * 26);
      c2.lineTo(75 + Math.cos(a2) * 12, 80 + Math.sin(a2) * 12);
    }
    c2.closePath(); c2.fill();
    c2.font = '16px serif'; c2.textAlign = 'center'; c2.fillStyle = '#fff';
    c2.fillText(['Merry', 'Christmas', 'Love'][i], 75, 150);
    const img = new Image();
    img.onload = () => addPhoto(img);
    img.src = cv.toDataURL();
  });
}

// ---------- 摄像头 + MediaPipe（高灵敏度跟手） ----------
const camBtn = document.getElementById('camBtn');
const video = document.getElementById('cam');
let camActive = false, hands = null;

camBtn.addEventListener('click', async () => {
  if (camActive) return;
  if (!window.Hands) { showError('MediaPipe 脚本加载失败，请检查网络后刷新。'); return; }
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user', frameRate: 30 } });
      video.srcObject = stream; await video.play();
      video.style.display = 'block'; statusEl.style.display = 'block';
      camBtn.classList.add('on'); camBtn.textContent = '🎥 已开启';
      camActive = true; initHands();
    } catch (e) {
      showError('无法访问摄像头：' + e.message + '<br>请允许权限，并通过 http://localhost 访问（file:// 会被浏览器安全策略阻止）。');
    }
  } else showError('当前环境不支持摄像头，请通过 http://localhost 或 https 打开。');
});

function initHands() {
  hands = new window.Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
  hands.onResults(onHandResults);
  detectLoop();
}

const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fingerExt = [false, false, false, false];
let curGesture = 'none', candGesture = 'none', candCount = 0, lastGestureTime = 0;
let pointState = { idx: -1, since: 0 };
let lastHandX = null, lastHandT = 0, handVX = 0;

function onHandResults(res) {
  if (!res.multiHandLandmarks || !res.multiHandLandmarks.length) {
    feedCandidate('none'); camHandActive = false; lastHandX = null;
    statusEl.textContent = '未检测到手，请将手放入画面';
    return;
  }
  camHandActive = true;
  const lm = res.multiHandLandmarks[0];

  // 手掌位置（镜像）→ 屏幕坐标：选照片 + 挥手转树
  const hx = (1 - lm[9].x) * W, hy = lm[9].y * H;
  handMarker = { x: hx, y: hy, seenAt: performance.now() };
  const now = performance.now();
  if (lastHandX !== null) {
    const dtp = Math.max((now - lastHandT) / 1000, 0.033);
    handVX = handVX * 0.7 + ((hx - lastHandX) / dtp) * 0.3;
    spinBoost = Math.max(-2.6, Math.min(2.6, handVX / 380)) * 1.6;
  }
  lastHandX = hx; lastHandT = now;

  // 手贴近照片 → 高亮（仅在绽放模式，照片漂浮时）
  handSelIdx = (mode === 'burst' && enlarged < 0) ? (hitTest(hx, hy) >= 0 ? hitTest(hx, hy) : nearestPhoto(hx, hy, 150)) : -1;

  // 手势：掌长归一化 + 迟滞防抖
  const palm = dist2(lm[0], lm[9]) || 0.08;
  const pairs = [[8, 6], [12, 10], [16, 14], [20, 18]];
  let extCount = 0;
  for (let i = 0; i < 4; i++) {
    const ratio = dist2(lm[pairs[i][0]], lm[0]) / palm;
    if (ratio > 1.62) fingerExt[i] = true;
    else if (ratio < 1.38) fingerExt[i] = false;
    if (fingerExt[i]) extCount++;
  }
  const pinch = dist2(lm[4], lm[8]) / palm < 0.5 && (fingerExt[1] || fingerExt[2]); // 拇指食指捏合
  // 👍 大拇指：四指收拢 + 拇指伸长且竖直向上
  const thumbUp = !fingerExt[0] && !fingerExt[1] && !fingerExt[2] && !fingerExt[3]
    && dist2(lm[4], lm[0]) / palm > 1.05
    && lm[4].y < lm[2].y - 0.03;
  let g = 'none';
  if (pinch) g = 'pinch';
  else if (extCount >= 3) g = 'open';
  else if (thumbUp) g = 'thumb';
  else if (extCount <= 1) g = 'fist';
  feedCandidate(g);

  statusEl.textContent = (g === 'open' ? '✋ 绽放星云' : g === 'thumb' ? '👍 放大最近照片'
    : g === 'fist' ? '✊ 收回 / 关闭' : g === 'pinch' ? '🤏 捏合关闭' : '🤔 过渡');
}

function feedCandidate(g) {
  const now = performance.now();
  if (g === candGesture) candCount++; else { candGesture = g; candCount = 1; }
  if (candCount >= 1 && candGesture !== curGesture && now - lastGestureTime > 180) {
    curGesture = candGesture; lastGestureTime = now;
    triggerGesture(curGesture);
  }
}
function triggerGesture(g) {
  if (g === 'open') {
    if (enlarged >= 0) return;
    mode = 'burst'; flashStatus('✨ 粒子绽放成星云，照片漂浮其中');
  } else if (g === 'thumb') {
    if (enlarged >= 0) return;
    if (photos.length) {
      const hx = handMarker ? handMarker.x : W / 2, hy = handMarker ? handMarker.y : H / 2;
      let best = -1, bd = Infinity;
      photoScreen.forEach((p, i) => {
        const d = Math.hypot(p.sx - hx, p.sy - hy);
        if (d < bd) { bd = d; best = i; }
      });
      if (best >= 0) { enlarge(best); flashStatus('👍 放大最近的照片'); }
    } else flashStatus('👍 还没有照片，先拖一张进来');
  } else if (g === 'fist') {
    if (enlarged >= 0) { enlarged = -1; flashStatus('✊ 收回照片'); }
    else if (mode === 'burst') { mode = 'tree'; flashStatus('🎄 星云回归圣诞树'); }
  } else if (g === 'pinch') {
    if (enlarged >= 0) { enlarged = -1; flashStatus('🤏 已关闭照片'); }
  }
}

async function detectLoop() {
  if (camActive && hands && video.readyState >= 2) {
    try { await hands.send({ image: video }); } catch (e) { }
  }
  setTimeout(detectLoop, 33);
}
